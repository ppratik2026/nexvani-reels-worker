name: Reels worker

# Makes the website posters and the reels for NexVani Media's newly published stories (worker.py) and uploads them
# to the website, which posts them everywhere. Public repository, so GitHub Actions minutes are free: it runs every
# 30 minutes, and the website can also start it (workflow_dispatch). The website's code stays private; this repository
# only draws posters and reels. The music tracks are not stored here: the worker downloads them from the website.
# Needs repository secrets SITE_URL (public https URL of the English website) and REELS_SECRET (the same value as the
# website's REELS_SECRET).
on:
  workflow_dispatch:
    inputs:
      site:
        description: "Edition code (set by the website; informational)"
        required: false
        default: all
      site_url:
        description: "Only this website (empty = every language edition)"
        required: false
        default: ""
  schedule:
    - cron: "*/30 * * * *"

concurrency:
  group: reels-${{ inputs.site_url || inputs.site || 'all' }}
  cancel-in-progress: false

jobs:
  reels:
    # pinned: the newest image (26.04) could not reach its package mirror, so ffmpeg failed to install on every run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install ffmpeg and fonts
        timeout-minutes: 8
        run: |
          # every script's font for the language editions; Chinese/Japanese/Korean fonts only when such an edition exists
          CJK=""
          if curl -fsS -m 20 "${{ secrets.SITE_URL }}/api/editions" | grep -qE '"lang":"(zh|ja|ko)"'; then CJK=fonts-noto-cjk; fi
          # one quick try at Ubuntu's mirror; when it is down (it has been), carry on without it instead of failing the run
          if sudo timeout 90 apt-get update -o Acquire::http::Timeout=15 -o Acquire::Retries=1; then
            sudo timeout 240 apt-get install -y --no-install-recommends ffmpeg fonts-noto-color-emoji fonts-noto-core $CJK && echo "APT_OK=1" >> "$GITHUB_ENV" || echo "::warning::apt install failed; using fallbacks"
          else
            echo "::warning::Ubuntu package mirror unreachable; using fallbacks"
          fi
          # ffmpeg fallback: a static build from GitHub
          if ! command -v ffmpeg >/dev/null; then
            curl -fsSL -m 180 -o /tmp/ffmpeg.tar.xz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
            tar -xJf /tmp/ffmpeg.tar.xz -C /tmp
            sudo install -m 755 /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffmpeg /tmp/ffmpeg-master-latest-linux64-gpl/bin/ffprobe /usr/local/bin/
          fi
          # emoji font fallback (the brand fonts ship with this repository)
          if ! fc-list | grep -qi "Noto Color Emoji"; then
            mkdir -p ~/.local/share/fonts
            curl -fsSL -m 60 -o ~/.local/share/fonts/NotoColorEmoji.ttf https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf && fc-cache -f >/dev/null || true
          fi
          ffmpeg -hide_banner -version | head -1

      - name: Install Python packages
        run: |
          pip install -r requirements.txt
          # Chromium's system libraries come from apt too; the runner image already has them, so skip that when apt is down
          if [ "$APT_OK" = 1 ]; then timeout 300 python -m playwright install --with-deps chromium || python -m playwright install chromium
          else python -m playwright install chromium; fi

      - name: Make and upload reels
        env:
          MAIN_SITE_URL: ${{ secrets.SITE_URL }}
          ONLY_SITE: ${{ inputs.site_url }}
          REELS_SECRET: ${{ secrets.REELS_SECRET }}
          REELS_LIMIT: "10"
        run: |
          if [ -n "$ONLY_SITE" ]; then
            sites="$ONLY_SITE"
          else
            sites=$(curl -fsS -m 20 "$MAIN_SITE_URL/api/editions" | python -c "import json,sys; print(' '.join(e['url'] for e in json.load(sys.stdin)['editions']))" || echo "$MAIN_SITE_URL")
          fi
          status=0
          for url in $sites; do
            echo "::group::$url"
            SITE_URL="$url" python -u worker.py || status=1
            echo "::endgroup::"
          done
          exit $status
